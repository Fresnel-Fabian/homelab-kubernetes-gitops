apiVersion: v1
data:
  values.yaml: |
    grafana:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 20Gi

    prometheusOperator:
      kubeletEndpointsEnabled: false
      kubeletEndpointSliceEnabled: true
    prometheus-node-exporter:
      extraArgs:
        - --no-collector.kernel_hung
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: prometheus-values
  namespace: flux-system
