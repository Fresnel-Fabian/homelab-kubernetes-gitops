apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llm
  labels:
    app.kubernetes.io/name: llama-server
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU workload — no rolling update
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-server
        app.kubernetes.io/component: inference
    spec:
      nodeSelector:
        gpu.type: amd-rx6600xt
      tolerations:
        - key: gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.22.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              f=/models/Qwen3.5-9B-UD-Q4_K_XL.gguf
              if [ -s "$f" ]; then echo "model present"; exit 0; fi
              curl -fL --retry 5 --retry-delay 10 -o "$f.part" \
                https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-UD-Q4_K_XL.gguf
              mv "$f.part" "$f"
              rm -f /models/qwen3-8b-q4_k_m.gguf   # reclaim PVC space
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-rocm
          args:
            - "--model"
            - "/models/Qwen3.5-9B-UD-Q4_K_XL.gguf"
            - "--alias"
            - "qwen3.5-9b"          # stable model name for clients (k8sgpt, OpenClaw)
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--n-gpu-layers"
            - "99"
            - "--fit"
            - "off"                 # fail loudly instead of silently shrinking ctx
            - "--ctx-size"
            - "65536"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--keep"
            - "256"
            - "--parallel"
            - "1"
            - "--cache-ram"
            - "1024"
            - "--metrics"
            - "--jinja"
            - "--no-webui"
            - "--temp"
            - "0.7"
            - "--top-p"
            - "0.8"
            - "--top-k"
            - "20"
            - "--presence-penalty"
            - "1.5"
            - "--chat-template-kwargs"
            - '{"enable_thinking":false}'
          env:
            # ROCm overrides for Navi 23 (RX 6600 XT → gfx1032)
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "10.3.0"
            - name: GPU_MAX_ALLOC_PERCENT
              value: "100"
            - name: GPU_MAX_HEAP_SIZE
              value: "100"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: 250m
              memory: 6Gi          # was 512Mi — model file alone is ~4.7 GiB mmap'd
              amd.com/gpu: 1
            limits:
              cpu: 4000m
              memory: 8Gi          # was 6Gi — leaves headroom for cache + overhead
              amd.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30    # Allow up to 5 min for model load
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-server-models
