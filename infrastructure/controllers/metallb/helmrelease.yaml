# infrastructure/controllers/metallb/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: metallb-system

  chart:
    spec:
      chart: metallb
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h

  install:
    createNamespace: true
    crds: Create

  upgrade:
    crds: CreateReplace

  values:
    prometheus:
      serviceMonitor:
        enabled: true
      serviceAccount: monitoring-prometheus-kube-prometheus
      namespace: monitoring

    speaker:
      frr:
        enabled: false

    frrk8s:
      enabled: false

    frr-k8s:
      prometheus:
        serviceMonitor:
          enabled: false
